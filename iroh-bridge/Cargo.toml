[package]
name = "buzz-host-iroh"
version = "0.1.0"
edition = "2021"
description = "Iroh QUIC -> loopback TCP bridge for buzz-host's token listener (guestPort)"
publish = false

[[bin]]
name = "buzz-host-iroh"
path = "src/main.rs"

[lib]
name = "buzz_host_iroh"
path = "src/lib.rs"

[dependencies]
# Semver ^1.3.0: resolves to the same iroh release buzz-app locks.
iroh = "1.3.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "time", "sync", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"
url = "2"

[profile.release]
opt-level = 3
strip = true
